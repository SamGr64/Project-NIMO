name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip build
      - name: Build
        run: python -m build
      - name: Verify wheel
        run: |
          python -m pip install dist/*.whl
          nimo --version
      - uses: actions/upload-artifact@v4
        with:
          name: project-nimo-${{ github.ref_name }}
          path: dist/*
