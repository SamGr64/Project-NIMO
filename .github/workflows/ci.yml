name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Project NIMO
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,dev]"
      - name: Static checks
        run: |
          python -m compileall -q src dashboard scripts
          python -m ruff check src dashboard scripts tests
      - name: Test
        run: python -m pytest --cov=nimo --cov-report=term-missing
      - name: Build distributions
        run: python -m build

  sample-workflow:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install core and report dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[reports,documents,security]"
      - name: Exercise PowerShell CLI workflow
        shell: pwsh
        run: |
          nimo --data-root "$env:RUNNER_TEMP\nimo-data" user create ci_user
          nimo --data-root "$env:RUNNER_TEMP\nimo-data" generate ci_user --seed 42 --start 2024-01-01 --end 2026-07-31
          nimo --data-root "$env:RUNNER_TEMP\nimo-data" behaviours ci_user --json
          nimo --data-root "$env:RUNNER_TEMP\nimo-data" forecast run ci_user --months 6 --runs 100 --json
          nimo --data-root "$env:RUNNER_TEMP\nimo-data" report build ci_user --format html --json
          nimo --data-root "$env:RUNNER_TEMP\nimo-data" doctor ci_user --json
