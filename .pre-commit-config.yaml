repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: python -m ruff check src dashboard scripts tests
        language: system
        pass_filenames: false
      - id: compileall
        name: Python compile check
        entry: python -m compileall -q src dashboard scripts
        language: system
        pass_filenames: false
      - id: pytest
        name: Pytest
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
