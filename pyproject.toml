[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-nimo"
version = "0.5.0"
description = "A local-first behavioural budgeting, cash-flow and synthetic statement analysis application"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Project NIMO"}]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pydantic>=2.8,<3",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.42,<2",
    "plotly>=5.24,<7",
]
reports = [
    "jinja2>=3.1,<4",
    "openai>=2.0,<3",
    "kaleido>=0.2,<2",
]
excel = ["openpyxl>=3.1,<4"]
documents = ["python-docx>=1.1,<2"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "hypothesis>=6,<7",
    "ruff>=0.9,<1",
    "mypy>=1.13,<2",
]
all = [
    "streamlit>=1.42,<2",
    "plotly>=5.24,<7",
    "jinja2>=3.1,<4",
    "openai>=2.0,<3",
    "kaleido>=0.2,<2",
    "openpyxl>=3.1,<4",
    "python-docx>=1.1,<2",
]

[project.scripts]
nimo = "nimo.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
