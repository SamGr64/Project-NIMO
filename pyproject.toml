[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "NIMO"
version = "0.1.1"
description = "Transparent, accessible, and agentically optimised advanced wealth management and capital modelling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "PyYAML>=6.0",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.36,<2",
    "pandas>=2.1,<3",
    "altair>=5.5,<6",
    "typing_extensions>=4.10,<5",
]
openai = ["openai>=2.0,<3"]

[tools.setuptools.packages.find]
where = ["src"]
